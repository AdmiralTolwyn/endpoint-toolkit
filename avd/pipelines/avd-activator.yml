name: $(Date:yyyyMMdd)$(Rev:.r)-AVD-Hybrid-Activator

trigger: none
pr: none

# SCHEDULE: Runs every 15 minutes
schedules:
- cron: "*/15 * * * *"
  displayName: "Hybrid Join Activator"
  branches:
    include:
    - main
  always: true

pool:
  vmImage: 'windows-latest'

variables:
  serviceConnection: '<YOURSERVICECONNECTION>'

jobs:
  - job: Activate
    displayName: "Hybrid Join Activator"
    # Runs every 15 min - keep the timeout well below the interval so a stuck
    # run cannot overlap the next scheduled trigger (default job timeout is 60).
    timeoutInMinutes: 25
    steps:
      - task: AzurePowerShell@5
        displayName: "Execute Activator Logic"
        inputs:
          azureSubscription: $(serviceConnection)
          ScriptType: 'FilePath'
          ScriptPath: '$(System.DefaultWorkingDirectory)/avd/scripts/Invoke-HybridActivator.ps1'
          azurePowerShellVersion: 'LatestVersion'