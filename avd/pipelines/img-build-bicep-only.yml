name: $(Date:yyyyMMdd)$(Rev:.r)-AVD-ImageBuild

trigger: none # Run manually

pr: none

# =============================================================================
# Azure Image Builder - Bicep-Only Pipeline (No Extension Required)
# =============================================================================
# Replaces AzureImageBuilderTask@1 entirely with:
#   - AzureCLI@2 for blob upload + Bicep deployment + build trigger + polling
#   - Bicep module for image template resource (API 2024-02-01)
#   - Workload identity federation support
#   - No marketplace extension dependency
#
# Stages:
#   1. Prepare  — Checkout, zip & upload artifacts to staging blob
#   2. Build    — 4 jobs: (1) DeployAndTrigger deploys the AIB template via Bicep
#                 and kicks off the build (--no-wait); (2) InitialDelay is an
#                 agentless server-side wait (pool: server) covering the minimum
#                 expected bake time, holding no hosted agent; (3)/(4) WaitForBuild1
#                 and WaitForBuild2 are resumable poll windows that each pick up
#                 the run's status and either finish or hand off to the next window.
#                 If a hosted agent is lost during a poll window, use "Rerun failed
#                 jobs" — the AIB build keeps running in Azure regardless, and
#                 polling simply resumes where it left off.
#   3. Cleanup  — Delete template + staging container (runs always); skips the
#                 template delete (without failing) if the build is still Running.
# =============================================================================

resources:
  repositories:
    - repository: aib_sources
      type: git
      name: '<YOURREPOSITORYNAME>'

pool:
  vmImage: 'windows-latest'

# -----------------------------------------------------------------------------
# CENTRALIZED CONFIGURATION
# -----------------------------------------------------------------------------
# Update the values below to match your environment. Everything else is derived.
# -----------------------------------------------------------------------------
variables:
  # ── YOUR ENVIRONMENT (update these) ────────────────────────────────────────
  - name: serviceConnection
    value: '<YOURSERVICECONNECTION>'
  - name: subscriptionId
    value: '<YOURSUBSCRIPTIONID>'
  - name: keyVaultName
    value: '<YOURKEYVAULTNAME>'
  - name: resourceGroup
    value: '<YOURRESOURCEGROUP-AIB>'
  - name: location
    value: 'westeurope'
  - name: managedIdentityName
    value: '<YOURMANAGEDIDENTITY>'
  - name: galleryName
    value: '<YOURGALLERYNAME>'
  - name: imageDefinitionName
    value: '<YOURIMAGEDEFINITION>'
  - name: baseImageSku
    value: 'win11-25h2-avd-m365'
  - name: storageAccountName
    value: '<YOURSTORAGEACCOUNT>'

  # ── STATIC / DERIVED (no changes needed) ──────────────────────────────────
  - name: baseImagePublisher
    value: 'microsoftwindowsdesktop'
  - name: baseImageOffer
    value: 'office-365'
  - name: targetRegions
    value: 'westeurope,northeurope'
  - name: vmSize
    value: 'Standard_D4_v5'
  - name: buildTimeout
    value: 150
  - name: initialDelayMinutes
    # Agentless (pool: server) server-side delay before the first status poll —
    # this is the minimum expected bake time, so we don't hold a hosted agent
    # while the build is definitely still running.
    value: 60
  - name: bicepTemplatePath
    value: '$(System.DefaultWorkingDirectory)/bicep/modules/imageTemplate.bicep'
  - name: managedIdentity
    value: '/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.ManagedIdentity/userAssignedIdentities/$(managedIdentityName)'
  - name: galleryImageId
    value: '/subscriptions/$(subscriptionId)/resourceGroups/$(resourceGroup)/providers/Microsoft.Compute/galleries/$(galleryName)/images/$(imageDefinitionName)'
  # The zip step archives $sourcePath\* flat and the bicep extracts flat to
  # C:\BuildArtifacts, so the customizer folder lands directly under it.
  - name: aibInternalScriptBasePath
    value: 'C:\BuildArtifacts\customizer'

stages:
  # ---------------------------------------------------------------------------
  # STAGE 1: PREPARE
  # Checks out sources and uploads build artifacts to a staging blob.
  # ---------------------------------------------------------------------------
  - stage: Prepare
    displayName: "Prepare Build"
    jobs:
      - job: UploadArtifacts
        displayName: "Upload Build Artifacts"
        steps:
          # ── 1. Checkout repository ─────────────────────────────────────────
          - checkout: aib_sources
            path: _<YOURREPOSITORYNAME>

          # ── 2. Inspect checkout contents ───────────────────────────────────
          - task: PowerShell@2
            displayName: 'Inspect Checkout Contents'
            inputs:
              targetType: inline
              script: |
                Write-Host "=== Workspace contents (2 levels deep) ==="
                Get-ChildItem -Path "$(System.DefaultWorkingDirectory)" -Recurse -Depth 2 |
                  Select-Object FullName, Mode, LastWriteTime | Format-Table -AutoSize

          # ── 3. Upload build artifacts to staging blob ──────────────────────
          - task: AzureCLI@2
            displayName: 'Upload Artifacts to Staging Blob'
            name: upload
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                $container = "aib-staging-$(Build.BuildId)"
                $blobName  = "buildartifacts.zip"
                $sourcePath = "$(System.DefaultWorkingDirectory)"
                $zipPath   = "$env:TEMP\$blobName"

                Write-Host "=== Zipping build artifacts ==="
                Write-Host "Source: $sourcePath"
                Compress-Archive -Path "$sourcePath\*" -DestinationPath $zipPath -Force
                $zipSize = (Get-Item $zipPath).Length / 1MB
                Write-Host "Archive size: $([math]::Round($zipSize, 2)) MB"

                Write-Host "=== Creating staging container ==="
                az storage container create `
                  --account-name $(storageAccountName) `
                  --name $container `
                  --auth-mode login `
                  --output none
                if ($LASTEXITCODE -ne 0) { throw "az storage container create failed with exit code $LASTEXITCODE" }

                Write-Host "=== Uploading artifacts ==="
                az storage blob upload `
                  --account-name $(storageAccountName) `
                  --container-name $container `
                  --file $zipPath `
                  --name $blobName `
                  --auth-mode login `
                  --output none
                if ($LASTEXITCODE -ne 0) { throw "az storage blob upload failed with exit code $LASTEXITCODE" }

                Write-Host "=== Generating user-delegation SAS token (4 hour expiry) ==="
                $expiry = (Get-Date).AddHours(4).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
                $sas = az storage blob generate-sas `
                  --account-name $(storageAccountName) `
                  --container-name $container `
                  --name $blobName `
                  --permissions r `
                  --expiry $expiry `
                  --auth-mode login `
                  --as-user `
                  -o tsv
                if ($LASTEXITCODE -ne 0) { throw "az storage blob generate-sas failed with exit code $LASTEXITCODE" }

                $blobUrl = "https://$(storageAccountName).blob.core.windows.net/$container/$blobName`?$sas"
                Write-Host "Artifact URL generated (expires: $expiry)"

                # Pipeline output variables
                Write-Host "##vso[task.setvariable variable=artifactBlobUrl;isOutput=true;issecret=true]$blobUrl"
                Write-Host "##vso[task.setvariable variable=stagingContainer;isOutput=true]$container"
                Write-Host "##vso[task.setvariable variable=templateName;isOutput=true]t_$(Build.BuildId)_$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"

                Remove-Item $zipPath -Force

  # ---------------------------------------------------------------------------
  # STAGE 2: BUILD IMAGE
  # Deploys the AIB image template via Bicep, triggers the build, polls status.
  # ---------------------------------------------------------------------------
  - stage: Build
    displayName: "Build Image"
    dependsOn: Prepare
    variables:
      artifactBlobUrl: $[ stageDependencies.Prepare.UploadArtifacts.outputs['upload.artifactBlobUrl'] ]
      stagingContainer: $[ stageDependencies.Prepare.UploadArtifacts.outputs['upload.stagingContainer'] ]
      templateName: $[ stageDependencies.Prepare.UploadArtifacts.outputs['upload.templateName'] ]
    jobs:
      - job: DeployAndTrigger
        displayName: "Deploy Template & Trigger Build"
        timeoutInMinutes: 90
        steps:
          # ── 4. Deploy AIB image template via Bicep ─────────────────────
          # az deployment group create blocks until AIB template provisioning
          # completes (observed 15-40 min) — this is provisioning the template
          # resource itself, not running the build.
          - task: AzureCLI@2
            displayName: 'Deploy AIB Image Template (Bicep)'
            name: deploy
            timeoutInMinutes: 60
            # Secret pipeline vars are not macro-substituted into scripts; pass
            # the SAS blob URL via the environment instead.
            env:
              ARTIFACT_BLOB_URL: $(artifactBlobUrl)
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'

                $templateName = "$(templateName)"
                Write-Host "=== Deploying image template: $templateName ==="

                # ── Inline customizer script ────────────────────────────────
                # Single-quoted here-string: only ADO $(...) macros expand
                # pipeline-side (e.g. aibInternalScriptBasePath); everything
                # else stays literal and runs inside the build VM.
                $inlineScript = @'
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Checking for artifacts...***"
                Get-ChildItem -Path "C:\BuildArtifacts" -Recurse | ForEach-Object { Write-Host $_.FullName }

                $ScriptBaseFolder = "$(aibInternalScriptBasePath)"

                # 1. DisableAutoUpdates.ps1
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Executing DisableAutoUpdates.ps1... ***"
                & "$ScriptBaseFolder\DisableAutoUpdates.ps1" -Verbose
                if ($LASTEXITCODE -ne 0) { Write-Host "##[error] DisableAutoUpdates.ps1 failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

                # 2. TimezoneRedirection.ps1
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Executing TimezoneRedirection.ps1...***"
                & "$ScriptBaseFolder\TimezoneRedirection.ps1" -Verbose
                if ($LASTEXITCODE -ne 0) { Write-Host "##[error] TimezoneRedirection.ps1 failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

                # 3. InstallLanguagePacks.ps1 (optional — uncomment to enable)
                # Write-Host "*** AVD AIB CUSTOMIZER PHASE : Executing InstallLanguagePacks.ps1...***"
                # & "$ScriptBaseFolder\InstallLanguagePacks.ps1" -LanguageList "German (Germany)" -Verbose
                # if ($LASTEXITCODE -ne 0) { Write-Host "##[error] InstallLanguagePacks.ps1 failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

                # 4. RemoveAppxPackages.ps1
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Executing RemoveAppxPackages.ps1... ***"
                $packagesToRemove = @(
                    "Clipchamp.Clipchamp",
                    "Microsoft.BingNews",
                    "Microsoft.BingSearch",
                    "Microsoft.BingWeather",
                    "Microsoft.GamingApp",
                    "Microsoft.GetHelp",
                    "Microsoft.MicrosoftSolitaireCollection",
                    "Microsoft.Windows.DevHome",
                    "Microsoft.WindowsSoundRecorder",
                    "Microsoft.Xbox.TCUI",
                    "Microsoft.XboxGamingOverlay",
                    "Microsoft.XboxIdentityProvider",
                    "Microsoft.XboxSpeechToTextOverlay",
                    "Microsoft.YourPhone",
                    "Microsoft.ZuneMusic",
                    "MicrosoftWindows.CrossDevice"
                )
                & "$ScriptBaseFolder\RemoveAppxPackages.ps1" -AppxPackages $packagesToRemove -Verbose
                if ($LASTEXITCODE -ne 0) { Write-Host "##[error] RemoveAppxPackages.ps1 failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

                # 5. UpdateWinGet.ps1
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Executing UpdateWinGet.ps1...***"
                $myAppList = @(
                      "7zip.7zip",
                      "Notepad++.Notepad++",
                      "Adobe.Acrobat.Reader.64-bit",
                      "Microsoft.RemoteHelp",
                      "Google.Chrome",
                      "Mozilla.Firefox",
                      "DuongDieuPhap.ImageGlass",
                      "Microsoft.PowerToys",
                      "geeksoftwareGmbH.PDF24Creator",
                      "Microsoft.VisualStudioCode",
                      "Git.Git",
                      "WinSCP.WinSCP",
                      "PuTTY.PuTTY",
                      "Microsoft.Sysinternals.Suite"
                  )
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Running Winget installation for $($myAppList.Count) apps...***"
                & "$ScriptBaseFolder\UpdateWinGet.ps1" -AppIds $myAppList -Verbose
                if ($LASTEXITCODE -ne 0) { Write-Host "##[error] UpdateWinGet.ps1 failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

                # 6. WindowsOptimization.ps1
                $specificOptimizations = @(
                    "ScheduledTasks",
                    "DefaultUserSettings",
                    "Autologgers",
                    "Services",
                    "NetworkOptimizations",
                    "LGPO",
                    "DiskCleanup",
                    "Edge"
                )
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Executing WindowsOptimization.ps1 with specific optimizations...***"
                & "$ScriptBaseFolder\WindowsOptimization.ps1" -Optimizations $specificOptimizations -Verbose
                if ($LASTEXITCODE -ne 0) { Write-Host "##[error] WindowsOptimization.ps1 failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

                # 7. UpdateWinGet.ps1 (provision-only re-run)
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Executing UpdateWinGet.ps1 (provision-only re-run)...***"
                & "$ScriptBaseFolder\UpdateWinGet.ps1" -SkipApps -SkipUserRegistration -Verbose
                if ($LASTEXITCODE -ne 0) { Write-Host "##[error] UpdateWinGet.ps1 (provision-only re-run) failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

                # 8. RemoveUserApps.ps1
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Executing RemoveUserApps.ps1...***"
                & "$ScriptBaseFolder\RemoveUserApps.ps1" -Verbose
                if ($LASTEXITCODE -ne 0) { Write-Host "##[error] RemoveUserApps.ps1 failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

                # 9. AdminSysPrep.ps1 (must run LAST, immediately before Sysprep/capture)
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Executing AdminSysPrep.ps1...***"
                & "$ScriptBaseFolder\AdminSysPrep.ps1" -Verbose
                if ($LASTEXITCODE -ne 0) { Write-Host "##[error] AdminSysPrep.ps1 failed with exit code $LASTEXITCODE"; exit $LASTEXITCODE }

                Write-Host "*** AVD AIB CUSTOMIZER PHASE : All scripts executed.***"
                Write-Host "*** AVD AIB CUSTOMIZER PHASE : Customization script finished.***"
                '@

                az deployment group create `
                  --resource-group $(resourceGroup) `
                  --template-file "$(bicepTemplatePath)" `
                  --parameters `
                    templateName=$templateName `
                    location=$(location) `
                    userAssignedIdentityId="$(managedIdentity)" `
                    sourceType=PlatformImage `
                    imagePublisher=$(baseImagePublisher) `
                    imageOffer=$(baseImageOffer) `
                    imageSku=$(baseImageSku) `
                    artifactsBlobUrl="$env:ARTIFACT_BLOB_URL" `
                    inlineCustomizerScript="$inlineScript" `
                    provisioner=powershell `
                    runElevated=true `
                    windowsUpdate=true `
                    distributeType=SharedImage `
                    galleryImageId="$(galleryImageId)" `
                    targetRegions="$(targetRegions)" `
                    distributeStorageAccountType=Standard_LRS `
                    distributeVersioningScheme=Latest `
                    excludeFromLatest=false `
                    optimizeVmBoot=true `
                    errorHandlingOnCustomizerError=cleanup `
                    errorHandlingOnValidationError=cleanup `
                    vmSize=$(vmSize) `
                    buildTimeoutInMinutes=$(buildTimeout)
                if ($LASTEXITCODE -ne 0) { throw "az deployment group create failed with exit code $LASTEXITCODE" }

                Write-Host "=== Image template deployed successfully ==="

          # ── 5. Trigger the image build (async - no polling here) ──────────
          - task: AzureCLI@2
            displayName: 'Trigger AIB Image Build'
            name: trigger
            timeoutInMinutes: 10
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $templateName = "$(templateName)"
                Write-Host "=== Triggering image build: $templateName ==="
                az image builder run `
                  --name $templateName `
                  --resource-group $(resourceGroup) `
                  --no-wait
                if ($LASTEXITCODE -ne 0) { throw "Failed to trigger image build (az image builder run exit code $LASTEXITCODE)" }
                Write-Host "Build triggered (async). Polling happens in later jobs after an agentless delay of $(initialDelayMinutes) min."

      # ── Job 2: agentless delay ───────────────────────────────────────────
      # Burns the minimum expected bake time without holding a hosted agent, so
      # agent-loss during the long build window is impossible here — there is
      # no agent to lose while this job is "running".
      - job: InitialDelay
        displayName: "Wait (agentless) - minimum bake time"
        dependsOn: DeployAndTrigger
        pool: server
        timeoutInMinutes: 75
        steps:
          - task: Delay@1
            displayName: 'Delay $(initialDelayMinutes) min (no agent held)'
            inputs:
              delayForMinutes: '$(initialDelayMinutes)'

      # ── Job 3: first poll window ─────────────────────────────────────────
      # Resumable: if the hosted agent is lost mid-window, "Rerun failed jobs"
      # picks polling back up — the AIB build itself is unaffected in Azure.
      - job: WaitForBuild1
        displayName: "Poll Build Status (window 1)"
        dependsOn: InitialDelay
        timeoutInMinutes: 55
        steps:
          - checkout: none
          - task: AzureCLI@2
            displayName: 'Poll AIB Build Status'
            name: poll
            timeoutInMinutes: 50
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $templateName   = "$(templateName)"
                $windowMinutes  = 45          # per-window poll budget (this job only)
                $isFinalWindow  = $false      # $true in WaitForBuild2: fail if still running at window end

                Write-Host "=== Polling build status: $templateName (window: $windowMinutes min, final: $isFinalWindow) ==="

                $startTime    = Get-Date
                $lastState    = ''
                $noStatusMins = 0

                while ($true) {
                  $elapsed = (Get-Date) - $startTime
                  $stamp   = $elapsed.ToString('hh\:mm\:ss')

                  # Per-window budget check FIRST so transient query failures can never bypass it.
                  if ($elapsed.TotalMinutes -gt $windowMinutes) {
                    if ($isFinalWindow) {
                      throw "Build still not finished after all poll windows (last state: $lastState) - exceeded buildTimeout budget."
                    }
                    Write-Host "Window budget reached - build still in progress (last state: $lastState)."
                    Write-Host "Handing off to the next poll window."
                    Write-Host "##vso[task.setvariable variable=buildDone;isOutput=true]false"
                    exit 0
                  }

                  # Query run status. try/catch: a transient az failure with empty stdout would
                  # otherwise make ConvertFrom-Json throw before the exit-code check is reached.
                  $status = $null
                  try {
                    $raw = az image builder show `
                      --name $templateName `
                      --resource-group $(resourceGroup) `
                      --query "lastRunStatus" `
                      -o json
                    if ($LASTEXITCODE -ne 0) { throw "az exit code $LASTEXITCODE" }
                    if ($raw) { $status = $raw | ConvertFrom-Json }
                  } catch {
                    Write-Host "[$stamp] WARN: could not query run status ($($_.Exception.Message)); retrying..."
                    Start-Sleep -Seconds 30
                    continue
                  }

                  $runState    = if ($status) { $status.runState } else { '' }
                  $runSubState = if ($status) { $status.runSubState } else { '' }

                  if ([string]::IsNullOrEmpty($runState)) {
                    # No run status yet — guard against idling forever if the run never registers.
                    $noStatusMins += 0.5
                    Write-Host "[$stamp] Waiting for build to start... (no run status yet)"
                    if ($noStatusMins -ge 10) { throw "No build run status after 10 min - the run never started (check permissions / template state)." }
                  }
                  else {
                    $noStatusMins = 0
                    if ("$runState/$runSubState" -ne $lastState) {
                      Write-Host "[$stamp] State: $runState | SubState: $runSubState"
                      $lastState = "$runState/$runSubState"
                    } else {
                      Write-Host "[$stamp] ... still $runState ($runSubState)"
                    }

                    if ($runState -eq 'Succeeded') {
                      Write-Host "=== Build completed successfully! ==="
                      break
                    }
                    elseif ($runState -eq 'Failed' -or $runState -eq 'Canceled') {
                      Write-Host "===== BUILD $($runState.ToUpper()) - full lastRunStatus ====="
                      $status | ConvertTo-Json -Depth 10 | Write-Host
                      $message = if ($status.message) { $status.message } else { "(no message returned - check the AIB customization.log in the staging storage account / packer log)" }
                      Write-Host "##vso[task.logissue type=error]Image build $runState`: $message"
                      throw "Image build $runState`: $message"
                    }
                  }

                  Start-Sleep -Seconds 30
                }

                # Retrieve the run output (image version URI)
                $runOutputs = az image builder show-runs `
                  --name $templateName `
                  --resource-group $(resourceGroup) `
                  -o json | ConvertFrom-Json

                if ($runOutputs -and $runOutputs.Count -gt 0) {
                  $artifactId = $runOutputs[0].artifactId
                  $artifactUri = $runOutputs[0].artifactUri
                  $imageUri = if ($artifactId) { $artifactId } else { $artifactUri }
                  Write-Host "=== Output image: $imageUri ==="
                  Write-Host "##vso[task.setvariable variable=imageUri;isOutput=true]$imageUri"
                }
                Write-Host "##vso[task.setvariable variable=buildDone;isOutput=true]true"

      # ── Job 4: second (final) poll window ────────────────────────────────
      # Only runs if window 1 handed off (buildDone=false); fails the build if
      # the run is still going after this window's budget is exhausted.
      - job: WaitForBuild2
        displayName: "Poll Build Status (window 2, final)"
        dependsOn: WaitForBuild1
        condition: and(succeeded(), ne(dependencies.WaitForBuild1.outputs['poll.buildDone'], 'true'))
        timeoutInMinutes: 55
        steps:
          - checkout: none
          - task: AzureCLI@2
            displayName: 'Poll AIB Build Status'
            name: poll
            timeoutInMinutes: 50
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Stop'
                $templateName   = "$(templateName)"
                $windowMinutes  = 45          # per-window poll budget (this job only)
                $isFinalWindow  = $true       # $true in WaitForBuild2: fail if still running at window end

                Write-Host "=== Polling build status: $templateName (window: $windowMinutes min, final: $isFinalWindow) ==="

                $startTime    = Get-Date
                $lastState    = ''
                $noStatusMins = 0

                while ($true) {
                  $elapsed = (Get-Date) - $startTime
                  $stamp   = $elapsed.ToString('hh\:mm\:ss')

                  # Per-window budget check FIRST so transient query failures can never bypass it.
                  if ($elapsed.TotalMinutes -gt $windowMinutes) {
                    if ($isFinalWindow) {
                      throw "Build still not finished after all poll windows (last state: $lastState) - exceeded buildTimeout budget."
                    }
                    Write-Host "Window budget reached - build still in progress (last state: $lastState)."
                    Write-Host "Handing off to the next poll window."
                    Write-Host "##vso[task.setvariable variable=buildDone;isOutput=true]false"
                    exit 0
                  }

                  # Query run status. try/catch: a transient az failure with empty stdout would
                  # otherwise make ConvertFrom-Json throw before the exit-code check is reached.
                  $status = $null
                  try {
                    $raw = az image builder show `
                      --name $templateName `
                      --resource-group $(resourceGroup) `
                      --query "lastRunStatus" `
                      -o json
                    if ($LASTEXITCODE -ne 0) { throw "az exit code $LASTEXITCODE" }
                    if ($raw) { $status = $raw | ConvertFrom-Json }
                  } catch {
                    Write-Host "[$stamp] WARN: could not query run status ($($_.Exception.Message)); retrying..."
                    Start-Sleep -Seconds 30
                    continue
                  }

                  $runState    = if ($status) { $status.runState } else { '' }
                  $runSubState = if ($status) { $status.runSubState } else { '' }

                  if ([string]::IsNullOrEmpty($runState)) {
                    # No run status yet — guard against idling forever if the run never registers.
                    $noStatusMins += 0.5
                    Write-Host "[$stamp] Waiting for build to start... (no run status yet)"
                    if ($noStatusMins -ge 10) { throw "No build run status after 10 min - the run never started (check permissions / template state)." }
                  }
                  else {
                    $noStatusMins = 0
                    if ("$runState/$runSubState" -ne $lastState) {
                      Write-Host "[$stamp] State: $runState | SubState: $runSubState"
                      $lastState = "$runState/$runSubState"
                    } else {
                      Write-Host "[$stamp] ... still $runState ($runSubState)"
                    }

                    if ($runState -eq 'Succeeded') {
                      Write-Host "=== Build completed successfully! ==="
                      break
                    }
                    elseif ($runState -eq 'Failed' -or $runState -eq 'Canceled') {
                      Write-Host "===== BUILD $($runState.ToUpper()) - full lastRunStatus ====="
                      $status | ConvertTo-Json -Depth 10 | Write-Host
                      $message = if ($status.message) { $status.message } else { "(no message returned - check the AIB customization.log in the staging storage account / packer log)" }
                      Write-Host "##vso[task.logissue type=error]Image build $runState`: $message"
                      throw "Image build $runState`: $message"
                    }
                  }

                  Start-Sleep -Seconds 30
                }

                # Retrieve the run output (image version URI)
                $runOutputs = az image builder show-runs `
                  --name $templateName `
                  --resource-group $(resourceGroup) `
                  -o json | ConvertFrom-Json

                if ($runOutputs -and $runOutputs.Count -gt 0) {
                  $artifactId = $runOutputs[0].artifactId
                  $artifactUri = $runOutputs[0].artifactUri
                  $imageUri = if ($artifactId) { $artifactId } else { $artifactUri }
                  Write-Host "=== Output image: $imageUri ==="
                  Write-Host "##vso[task.setvariable variable=imageUri;isOutput=true]$imageUri"
                }
                Write-Host "##vso[task.setvariable variable=buildDone;isOutput=true]true"

  # ---------------------------------------------------------------------------
  # STAGE 3: CLEANUP
  # Always runs — deletes the image template and staging container.
  # ---------------------------------------------------------------------------
  - stage: Cleanup
    displayName: "Cleanup"
    dependsOn: [Prepare, Build]
    condition: always()
    variables:
      templateName: $[ stageDependencies.Prepare.UploadArtifacts.outputs['upload.templateName'] ]
      stagingContainer: $[ stageDependencies.Prepare.UploadArtifacts.outputs['upload.stagingContainer'] ]
    jobs:
      - job: CleanupResources
        displayName: "Delete Template & Staging"
        steps:
          # ── 6. Delete image template + staging container ───────────────────
          - task: AzureCLI@2
            displayName: 'Delete AIB Template & Staging Blob'
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              addSpnToEnvironment: true
              scriptLocation: inlineScript
              inlineScript: |
                $ErrorActionPreference = 'Continue'

                $templateName = "$(templateName)"
                $container = "$(stagingContainer)"

                # Never delete a template whose build is still running: an agent-loss or
                # pipeline failure must not destroy a healthy in-progress bake. AIB delete
                # on a running template cancels/tears down the build. Query runState first
                # and skip (without failing) if the build is still Running.
                $runState = az image builder show `
                  --name $templateName `
                  --resource-group $(resourceGroup) `
                  --query "lastRunStatus.runState" `
                  -o tsv 2>$null

                if ($LASTEXITCODE -ne 0) {
                  Write-Host "Template $templateName not found (or query failed) - skipping template delete."
                }
                elseif ($runState -eq 'Running') {
                  Write-Host "##vso[task.logissue type=warning]Build for template $templateName is still RUNNING - skipping cleanup so the bake is not destroyed. Re-run the Cleanup stage (or delete manually) once the build finishes."
                  exit 0
                }
                else {
                  # AIB can still briefly refuse deletion right after a run ends, so
                  # retry with backoff. Cleanup must not hard-fail the pipeline, but
                  # real errors are surfaced as warnings (never silently swallowed).
                  Write-Host "=== Deleting image template: $templateName (runState: $runState) ==="
                  $maxRetries = 5
                  $deleted = $false
                  for ($i = 1; $i -le $maxRetries; $i++) {
                    $deleteOutput = az image builder delete `
                      --name $templateName `
                      --resource-group $(resourceGroup) `
                      --output none 2>&1
                    if ($LASTEXITCODE -eq 0) {
                      Write-Host "Template deleted."
                      $deleted = $true
                      break
                    }
                    Write-Host "Attempt $i/$maxRetries to delete template failed (exit $LASTEXITCODE); a run may still be finishing."
                    if ($i -lt $maxRetries) { Start-Sleep -Seconds 60 }
                  }
                  if (-not $deleted) {
                    Write-Host "##vso[task.logissue type=warning]Failed to delete image template $templateName after $maxRetries attempts: $deleteOutput"
                  }
                }

                Write-Host "=== Deleting staging container: $container ==="
                $containerDeleteOutput = az storage container delete `
                  --account-name $(storageAccountName) `
                  --name $container `
                  --auth-mode login `
                  --output none 2>&1
                if ($LASTEXITCODE -ne 0) {
                  Write-Host "##vso[task.logissue type=warning]Failed to delete staging container $container (exit $LASTEXITCODE): $containerDeleteOutput"
                }
                else {
                  Write-Host "Staging container deleted."
                }
