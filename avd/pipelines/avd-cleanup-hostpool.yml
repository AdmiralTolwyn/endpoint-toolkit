name: $(Date:yyyyMMdd)$(Rev:.r)-AVD-Cleanup-Task

trigger: none
pr: none

pool:
  vmImage: 'windows-latest'

variables:
  serviceConnection: '<YOURSERVICECONNECTION>'

  # AVD Target
  hostPoolName: '<YOURHOSTPOOLNAME>' # Update for Legacy if needed
  hostPoolRg: '<YOURRESOURCEGROUP-CORE>'
  computeRg: '<YOURRESOURCEGROUP-COMPUTE>'      # Where the VMs are

  # Image Source (To define what is "New")
  galleryRg: '<YOURRESOURCEGROUP-AIB>'
  galleryName: '<YOURGALLERYNAME>'
  imageDef: '<YOURIMAGEDEFINITION>'

  # Key Vault (for telemetry secrets)
  keyVaultName: '<YOURKEYVAULTNAME>'

  # Cleanup Safety
  # simulate defaults to 'true' — destructive deletion requires an explicit
  # opt-in (set to 'false') when queuing the pipeline.
  simulate: 'true'
  drainGracePeriodHours: 24

  # Telemetry (optional — set to 'true' to send events to Log Analytics)
  enableTelemetry: 'false'

steps:
- task: AzurePowerShell@5
  displayName: "Run Decommissioning Logic"
  inputs:
    azureSubscription: $(serviceConnection)
    ScriptType: 'FilePath'
    ScriptPath: '$(System.DefaultWorkingDirectory)/avd/scripts/Remove-AvdHosts.ps1'
    ScriptArguments: >
      -HostPoolName "$(hostPoolName)"
      -HostPoolRg "$(hostPoolRg)"
      -ComputeRg "$(computeRg)"
      -GalleryRg "$(galleryRg)"
      -GalleryName "$(galleryName)"
      -ImageDef "$(imageDef)"
      -Simulate ([System.Convert]::ToBoolean('$(simulate)'))
      -DrainGracePeriodHours $(drainGracePeriodHours)
    azurePowerShellVersion: 'LatestVersion'

# OPTIONAL: Deployment Telemetry
- task: AzureKeyVault@2
  displayName: "Fetch Telemetry Secrets"
  condition: and(succeeded(), eq(variables['enableTelemetry'], 'true'))
  continueOnError: true
  inputs:
    azureSubscription: $(serviceConnection)
    KeyVaultName: $(keyVaultName)
    SecretsFilter: 'log-analytics-workspace-id,log-analytics-shared-key'

- task: AzurePowerShell@5
  displayName: "Telemetry → Cleanup"
  condition: and(succeeded(), eq(variables['enableTelemetry'], 'true'))
  continueOnError: true
  inputs:
    azureSubscription: $(serviceConnection)
    ScriptType: 'FilePath'
    ScriptPath: '$(System.DefaultWorkingDirectory)/avd/scripts/Write-DeploymentTelemetry.ps1'
    azurePowerShellVersion: 'LatestVersion'
  env:
    WORKSPACE_ID: $(log-analytics-workspace-id)
    SHARED_KEY: $(log-analytics-shared-key)
    EVENT_DATA_JSON: '{"HostPoolName":"$(hostPoolName)","Stage":"Cleanup","Action":"Decommission","Status":"Success","PipelineRunId":"$(Build.BuildId)"}'
